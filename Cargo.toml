[package]
name = "nntpbench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
memchr = "2.8.0"
socket2 = "0.6.3"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
divan = "0.1"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dev-dependencies]
iai-callgrind = "0.16.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[[bench]]
name = "server_roundtrip"
harness = false

[[bench]]
name = "server_callgrind"
harness = false

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[profile.bench]
inherits = "release"
debug = 2
strip = false
