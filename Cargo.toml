[package]
name = "nntpbench"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arrayvec = "0.7.8"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
memchr = "2.8.3"
md5 = { package = "md-5", version = "0.11.0" }
socket2 = { version = "0.6.5", features = ["all"] }
yenc = "0.2.2"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
coz = { version = "0.1.3", optional = true }

[features]
coz = ["dep:coz"]

[dev-dependencies]
divan = "0.1.21"
proptest = "1.12.0"
serde_json = "1.0.154"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dev-dependencies]
gungraun = "0.20.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage_nightly)",
    "cfg(response_contract, values(none(), \"coordinate\", \"receive_alias\", \"validated_mutation\", \"validated_rebind\"))",
] }

[[bench]]
name = "server_roundtrip"
harness = false

[[bench]]
name = "server_gungraun"
harness = false

[[bench]]
name = "client_gungraun"
harness = false

[[bench]]
name = "client_roundtrip"
harness = false

[[bench]]
name = "response_parsing"
harness = false

[[bench]]
name = "client_overheads"
harness = false

[[bench]]
name = "client_coordination"
harness = false

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[profile.bench]
inherits = "release"
debug = 2
strip = false
