[package]
name = "nntpbench"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
memchr = "2.7.4"
socket2 = "0.6.3"
tokio = { version = "1.45.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }
